[package]
name = "bind19"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "replay_bench"
harness = false
