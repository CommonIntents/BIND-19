# ci/baseline.toml — the ONE waiver file every shape check shares.
#
# Rules that make a waiver a debt rather than a permission:
#   1. `owner` and `due` are mandatory. An exemption nobody owns is not an
#      exemption, it is an omission.
#   2. On `due`, the waiver STOPS WORKING and the check goes red again. It does
#      not renew itself.
#   3. The count only shrinks. Adding a waiver requires removing one, so the
#      list cannot quietly become the new normal.
#
# Deliberately NOT in the file it protects: a file must not be able to sign its
# own pass (that is the PFP Override-Flag shape, and P4 forbids it).
#
# The numbers are deliberately absent — the check derives them. A written-down
# count rots (P8).

[[waiver]]
check   = "CI-4"
target  = "catastrophic_detection/catastrophic-catastrophic_override"
reason  = "declared but no test exercises it yet (K-013)"
owner   = "TBD"
due     = "2026-10-18"

