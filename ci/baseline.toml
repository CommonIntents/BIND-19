# ci/baseline.toml — the ONE waiver file every shape check shares.
#
# A waiver is a debt with a date, not a permission:
#   1. `owner` and `due` are mandatory. An exemption nobody owns is an omission.
#   2. On `due` the waiver STOPS WORKING and the check goes red again.
#   3. WAIVERS ARE BATCHED. The 33 CI-4 targets were first given one shared date,
#      which is its own defect: they are eight independent implementations (the
#      vector file has no loader at all — zero parse calls across tests/), so a
#      single deadline would turn the whole repo red on one morning and get the
#      gate switched off rather than satisfied. A date that cannot be met is a
#      date that gets removed.
#   4. The counts are NOT written here. The checker derives them; a written-down
#      number rots (P8).
#
# Batch order follows how much already exists to build on: `pfp_codec` first,
# because src/pfp.rs already has the codec and its unit tests, so those five can
# be proven rather than promised.

[[waiver]]
check   = "CI-4"
target  = "catastrophic_detection/catastrophic-catastrophic_override"
reason  = "BLOCKED on H4 (which of the four statements is authoritative): these vectors pin an interpretation of rule 6 or the raw-risk predicate, and the spec contradicts itself. Implementing them now would freeze a possibly-wrong side into a golden. The due date is a placeholder until the ruling arrives."
owner   = "TBD"
due     = "2026-11-13"

